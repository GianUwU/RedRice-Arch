# Background transparency
background_opacity 0.4
confirm_os_window_close 0
window_padding_width 2 0 0 2
foreground #ffffff
cursor #e70c00
cursor_shape beam
selection_background #ffffff
selection_foreground #ff0000

# Clipboard shortcuts: copy selected text with Ctrl+C, otherwise send interrupt.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Open links with a plain left click (no Ctrl modifier needed).
mouse_map left click ungrabbed mouse_handle_click selection link prompt
color8 #5b5754
color1 #da2c20
color9 #e8bacf
color2 #00a152
color10 #3a3332
color3 #fcec02
color11 #494542
color4 #abff24
color12 #7f7c7b
color5 #a06994
color13 #d6d4d3
color6 #b5e4f4
color14 #ccab53
color7 #a4a1a1
color15 #f7f7f7

# Animated cursor trail (built-in shader, no extra dependencies needed)
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Optional custom motion-blur shader (requires: sudo pacman -S shader-slang)
# custom_shaders cursor-trail-motion-blur
